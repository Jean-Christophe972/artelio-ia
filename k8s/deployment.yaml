apiVersion: apps/v1
kind: Deployment
metadata:
  name: artelio-api
  labels: { app: artelio-api }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # mise à jour sans coupure
  selector:
    matchLabels: { app: artelio-api }
  template:
    metadata:
      labels: { app: artelio-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/artelio/artelio-api:latest
          ports: [{ containerPort: 8000, name: http }]
          envFrom:
            - configMapRef: { name: artelio-api }
            - secretRef: { name: artelio-api }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 2Gi }
          readinessProbe:          # le trafic n'arrive qu'une fois le modèle chargé
            httpGet: { path: /pret, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /sante, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
