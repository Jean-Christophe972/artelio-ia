# Mise à l'échelle automatique : de 2 à 8 répliques selon l'usage CPU (le modèle tourne sur CPU)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: artelio-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: artelio-api }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
